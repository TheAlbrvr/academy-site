<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizzatore PDF</title>
    <style>
        html, body { 
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #333333;
            overflow: hidden;
        }

        #contenuto-riservato { 
            width: 100vw;
            height: 100vh;
        } 

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="contenuto-riservato">
        <!-- Richiama il viewer locale passando il file PDF relativo -->
        <iframe src="web/viewer.html?file=../libro.pdf">
            <p>Il tuo browser non supporta la visualizzazione dei PDF. 
               <a href="libro.pdf">Clicca qui per scaricare il file.</a>
            </p>
        </iframe>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Riservata - Ingredienti</title>
    <style>
        html, body { 
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #333333; /* Sfondo scuro per integrarsi col visualizzatore */
            overflow: hidden; /* Evita le doppie barre di scorrimento */
        }

        #contenuto-riservato { 
            width: 100vw;
            height: 100vh;
        } 

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="contenuto-riservato">
        <!-- Visualizzatore PDF.js locale con percorso relativo a libro.pdf -->
        <iframe src="pdfjs/web/viewer.html?file=../../libro.pdf">
            <p>Il tuo browser non supporta la visualizzazione diretta dei PDF. 
               <a href="libro.pdf">Clicca qui per scaricare il file.</a>
            </p>
        </iframe>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Area Riservata - Ingredienti</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 20px;
        }
        #contenuto-riservato { 
            display: none; 
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        } 
        /* Stile per rendere il visualizzatore PDF responsive e ben visibile */
        .pdf-container {
            width: 100%;
            height: 80vh; /* Occupa l'80% dell'altezza dello schermo */
            border: 1px solid #ccc;
            margin-top: 20px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Area di login iniziale -->
    <div id="box-login" style="margin-top: 50px;">
        <h2>Inserisci la password per accedere</h2>
        <input type="password" id="password-input" placeholder="Password...">
        <button onclick="verificaPassword()">Accedi</button>
        <p id="errore" style="color: red; display: none;">Password errata!</p>
    </div>

    <!-- Contenuto riservato: Visualizzazione del PDF -->
    <div id="contenuto-riservato">
        <h1>Libro Ingredienti Academy</h1>
        
        <div class="pdf-container">
            <iframe src="libro.pdf">
                <p>Il tuo browser non supporta la visualizzazione diretta dei PDF. 
                   <a href="Academy_LibroIngredienti_indice_strutturato 2(1).PDF" target="_blank">Clicca qui per scaricare il file.</a>
                </p>
            </iframe>
        </div>
    </div>

    <script>
        function verificaPassword() {
            var passwordCorretta = "zioedo"; 
            var inputUtente = document.getElementById("password-input").value;

            if (inputUtente === passwordCorretta) {
                document.getElementById("box-login").style.display = "none";
                document.getElementById("contenuto-riservato").style.display = "block";
            } else {
                document.getElementById("errore").style.display = "block";
            }
        }
    </script>

</body>
</html>

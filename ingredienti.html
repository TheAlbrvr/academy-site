<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Riservata - Ingredienti</title>
    <style>
        html, body { 
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #333333;
            overflow: hidden;
            
            /* Blocca la selezione del testo in tutta la pagina */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
        }

        #contenuto-riservato { 
            width: 100vw;
            height: 100vh;
        } 

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body oncontextmenu="return false;"> <!-- Disabilita il tasto destro -->

    <div id="contenuto-riservato">
        <iframe src="pdfjs-6.2.108-dist/web/viewer.html?file=../../libro.pdf">
            <p>Il tuo browser non supporta la visualizzazione diretta dei PDF.</p>
        </iframe>
    </div>

    <script>
        // Disabilita le scorciatoie da tastiera per Stampa (Ctrl+P) e Copia (Ctrl+C)
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'c' || e.key === 's')) {
                e.preventDefault();
                e.stopPropagation();
            }
        });
    </script>

</body>
</html>

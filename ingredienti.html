<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Riservata - Ingredienti</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 20px;
        }
        #contenuto-riservato { 
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        } 
        .pdf-container {
            width: 100%;
            height: 85vh;
            border: 1px solid #ccc;
            margin-top: 20px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="contenuto-riservato">
        <h1>Libro Ingredienti Academy</h1>
        
        <div class="pdf-container">
            <!-- Usa il viewer ufficiale di PDF.js fornito da Mozilla via CDN -->
            <iframe src="https://mozilla.github.io/pdf.js/web/viewer.html?file=libro.pdf"></iframe>
        </div>
    </div>

</body>
</html>
